<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Kiez Berlin - Offizieller Kiez-Guide & Community</title>
  
  <!-- Web App Metadata & Favicon -->
  <meta name="description" content="My Kiez Berlin - Dein digitaler Begleiter für Berliner Kieze, Veranstaltungen, Gastro, Jobs und Notrufe.">
  <meta name="theme-color" content="#E30613">
  <link rel="icon" type="image/png" href="assets/images/mykiez_logo.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  
  <!-- Bootstrap Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-extended.css">
  <link rel="stylesheet" href="ui-fixes.css?v=1">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="layout-wide.css?v=1">
</head>
<body>

  <!-- Main Responsive Mobile Container -->
  <div id="app-container">
    <h1 class="mk-sr-only">My Kiez Berlin – Dein Kiez-Guide für Berlin</h1>

    <!-- Top Bar (Header with Pure Vector Logo, Hamburger Hub, APK Download & Live Alerts) -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button id="hamburger-btn" class="btn-icon-circle" title="Menü / Kiez Hub">
          <i class="bi bi-list" style="font-size: 22px;"></i>
        </button>
        <div class="brand-link" onclick="switchTab('home')">
          <img src="assets/images/mykiez_logo.png" alt="My Kiez Berlin Logo" class="app-logo-img">
          <span class="brand-title">My Kiez Berlin</span>
        </div>
      </div>

      <div class="top-bar-right">
        <!-- Direct APK Download Button -->
        <a href="https://pub-2416186352064f76ad404097041588ba.r2.dev/MyKiezBerlin.com.apk" download class="btn-apk-download" title="Offizielle Android App herunterladen">
          <i class="bi bi-android2"></i>
          <span class="apk-btn-text">APK İndir</span>
        </a>

        <button class="btn-b2b ext-live-pill" onclick="switchTab('bulletin')" title="Live-Ticker"><span>Live-Ticker</span></button>
        <button class="btn-b2b ext-b2b-pill" onclick="switchTab('portal')" title="B2B"><i class="bi bi-building"></i> <span>B2B</span></button>

        <!-- Live Alerts Bell Toggle -->
        <button id="bell-toggle-btn" class="btn-icon-circle" title="Live-Hinweise & Benachrichtigungen" aria-label="Live-Hinweise & Benachrichtigungen">
          <i class="bi bi-bell-fill"></i>
          <span class="badge-dot pulse"></span>
        </button>

        <!-- Language Switcher -->
        <button id="lang-toggle-btn" class="btn-icon-circle" title="Sprache wechseln / Dil Değiştir">
          TR
        </button>

        <!-- Admin -->
        <a href="admin.html" class="btn-b2b mk-admin-link" style="text-decoration: none;" title="Admin-Bereich" aria-label="Admin-Bereich">
          <i class="bi bi-shield-lock-fill"></i> <span class="admin-btn-text">Admin</span>
        </a>
      </div>
    </header>

    <!-- Real-Time Berlin Alert Ticker (S-Bahn, BVG, Feuerwehr, Polizei) -->
    <div id="live-alert-ticker-container"></div>

    <!-- Search Box -->
    <div class="search-wrapper">
      <div class="search-input-box">
        <i class="bi bi-search" style="color: var(--text-muted);"></i>
        <input type="text" id="global-search-input" placeholder="Kiez, dükkan, etkinlik veya sokak ara...">
      </div>
    </div>

    <!-- Stories Bar (Instagram / WhatsApp Style) -->
    <section class="stories-section">
      <div class="stories-header">
        <span class="stories-title">KIEZ STORIES</span>
        <span class="stories-add-btn" onclick="openCreateStoryModal()">+ Durum Paylaş</span>
      </div>
      <div class="stories-scroll" id="stories-scroll-container">
        <!-- Rendered dynamically by app.js -->
      </div>
    </section>

    <!-- Dynamic Content Area (Home, Kieze, Bulletin, Events, Jobs, Emergency, Quiz) -->
    <main class="main-content" id="main-tab-content">
      <!-- Injected by app.js -->
    </main>

    <!-- Bottom Navigation Bar (Matching Android Bottom Navigation Bar) -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home">
        <i class="bi bi-shop"></i>
        <span>Betriebe</span>
      </button>
      <button class="nav-item" data-tab="bulletin">
        <i class="bi bi-broadcast-pin"></i>
        <span>Live-Ticker</span>
      </button>
      <button class="nav-item" data-tab="sport">
        <i class="bi bi-graph-up-arrow"></i>
        <span>Sport & Kurse</span>
      </button>
      <button class="nav-item" data-tab="deals">
        <i class="bi bi-tag-fill"></i>
        <span>Gutscheine</span>
      </button>
      <button class="nav-item" data-tab="more">
        <i class="bi bi-list"></i>
        <span>Mehr</span>
      </button>
    </nav>

  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="data-extended.js"></script>
  <script src="app.js?v=2"></script>
  <script src="app-extended.js?v=4"></script>
  <script src="app-parity.js?v=2"></script>
  <script src="sponsor-seen.js?v=1"></script>
  <script src="app-werbung.js?v=2"></script>
<script src="goal-celebration.js"></script>
<script src="classified-promo.js"></script>
<script src="kiez-stars.js?v=3"></script>
<script src="sponsor-sizes.js?v=4"></script>
<script src="package-info.js?v=1"></script>
<script src="sponsor-rotation.js?v=5"></script>
<script src="sponsor-info.js?v=3"></script>
<script src="home-deck.js?v=3"></script>
<script src="support.js?v=1"></script>
<script src="story-download.js?v=1"></script>
<script src="admin-share.js?v=2"></script>
<script src="story-multi.js?v=1"></script>
<script src="kiez-plus.js?v=2"></script>
<script src="sponsor-reel.js?v=1"></script>
<script src="kiez-word.js?v=1"></script>
<script src="ui-fixes.js?v=1"></script>
<script src="visit.js?v=1"></script>
</body>
</html>
