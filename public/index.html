<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Kiez Berlin - Offizieller Kiez-Guide & Community</title>
  
  <!-- Web App Metadata & Favicon -->
  <meta name="description" content="My Kiez Berlin - Dein digitaler Begleiter für Berliner Kieze, Veranstaltungen, Gastro, Jobs und Notrufe.">
  <meta name="theme-color" content="#E30613">
  <link rel="icon" type="image/png" href="assets/images/mykiez_logo.png">
  
  <!-- Bootstrap Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Main Responsive Mobile Container -->
  <div id="app-container">
    
    <!-- Top Bar (Header with Pure Vector Logo, Language Toggle & Sponsoring) -->
    <header class="top-bar">
      <div class="top-bar-left" onclick="switchTab('home')">
        <img src="assets/images/mykiez_logo.png" alt="My Kiez Berlin Logo" class="app-logo-img">
      </div>

      <div class="top-bar-right">
        <a href="admin.html" class="btn-b2b" style="text-decoration: none;">
          <i class="bi bi-shield-lock-fill"></i> Admin
        </a>
        <button id="lang-toggle-btn" class="btn-icon-circle" title="Sprache wechseln / Dil">
          TR
        </button>
        <button class="btn-icon-circle" onclick="alert('My Kiez Berlin Bildirimleri: Güncel etkinlikler ve kiez indirimleri aktif!')">
          <i class="bi bi-bell-fill"></i>
          <span class="badge-dot"></span>
        </button>
      </div>
    </header>

    <!-- Search Box -->
    <div class="search-wrapper">
      <div class="search-input-box">
        <i class="bi bi-search" style="color: var(--text-muted);"></i>
        <input type="text" id="global-search-input" placeholder="Kiez, dükkan, etkinlik veya sokak ara...">
      </div>
    </div>

    <!-- Stories Bar (Instagram / WhatsApp Style) -->
    <section class="stories-section">
      <div class="stories-header">
        <span class="stories-title">KIEZ STORIES</span>
        <span class="stories-add-btn" onclick="openCreateStoryModal()">+ Durum Paylaş</span>
      </div>
      <div class="stories-scroll" id="stories-scroll-container">
        <!-- Rendered dynamically by app.js -->
      </div>
    </section>

    <!-- Dynamic Content Area (Home, Kieze, Events, Jobs, Notruf, Quiz) -->
    <main class="main-content" id="main-tab-content">
      <!-- Injected by app.js -->
    </main>

    <!-- Bottom Navigation Bar (Matching Android Bottom Navigation Bar) -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home">
        <i class="bi bi-house-door-fill"></i>
        <span>Ana Sayfa</span>
      </button>
      <button class="nav-item" data-tab="kieze">
        <i class="bi bi-compass-fill"></i>
        <span>Kiezler</span>
      </button>
      <button class="nav-item" data-tab="events">
        <i class="bi bi-calendar-event-fill"></i>
        <span>Etkinlik</span>
      </button>
      <button class="nav-item" data-tab="jobs">
        <i class="bi bi-briefcase-fill"></i>
        <span>İşler</span>
      </button>
      <button class="nav-item" data-tab="quiz">
        <i class="bi bi-trophy-fill"></i>
        <span>Yarışma</span>
      </button>
      <button class="nav-item" data-tab="emergency">
        <i class="bi bi-telephone-fill"></i>
        <span>Acil</span>
      </button>
    </nav>

  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
