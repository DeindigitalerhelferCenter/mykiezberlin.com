<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-Plakat – My Kiez Berlin</title>
<meta name="robots" content="noindex">
<style>
  /* 2026-11-22 (owner): QR poster for sponsors (print A4). Link: mykiezberlin.com */
  :root{--navy:#0F172A;--blue:#1E3A8A;--gold:#FFC107;--red:#E30A17}
  *{box-sizing:border-box}
  body{margin:0;background:#e5e7eb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--navy)}
  .bar{display:flex;justify-content:center;gap:10px;padding:12px}
  .bar button{padding:10px 18px;border:0;border-radius:999px;background:var(--navy);color:#fff;font:inherit;font-weight:800;cursor:pointer}
  .page{width:210mm;min-height:297mm;margin:0 auto 20px;background:#fff;padding:18mm 16mm;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8mm}
  .logo{width:46mm}
  h1{margin:0;font-size:30pt;line-height:1.1}
  h1 span{color:var(--red)}
  .tr{font-size:17pt;color:#334155;margin:0}
  #qr{padding:6mm;border:3mm solid var(--navy);border-radius:8mm}
  .url{font-size:22pt;font-weight:900;color:var(--blue)}
  .points{font-size:14pt;line-height:1.6;margin:0}
  .partner{margin-top:auto;padding:5mm 9mm;border-radius:999px;background:var(--gold);font-weight:900;font-size:15pt}
  @media print{body{background:#fff}.bar{display:none}.page{margin:0}}
  @media (max-width:820px){.page{width:100%;min-height:auto;padding:24px 16px}h1{font-size:26px}.tr{font-size:16px}.url{font-size:20px}.points{font-size:15px}}
</style>
</head>
<body>
<div class="bar"><button type="button" onclick="print()">🖨️ Drucken / Yazdır</button></div>
<main class="page">
  <img class="logo" src="/assets/images/mykiez_logo.png" alt="My Kiez Berlin">
  <h1>Dein Kiez in einer App – <span>kostenlos</span></h1>
  <p class="tr">Mahallen tek uygulamada – ücretsiz</p>
  <div id="qr"></div>
  <div class="url">mykiezberlin.com</div>
  <p class="points">🚨 Live-Ticker · 🏷️ Angebote · 🤝 Betriebe im Kiez · 📰 Kiez-Stories<br>Canlı haberler · İndirimler · Mahalle işletmeleri · Hikâyeler</p>
  <div class="partner" id="partner">🤝 Wir sind Kiez-Partner von My Kiez Berlin</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  (function () {
    var s = new URLSearchParams(location.search).get("s") || "";
    var url = "https://mykiezberlin.com/" + (s ? "?utm_source=qr&utm_campaign=" + encodeURIComponent(s) : "");
    try { new QRCode(document.getElementById("qr"), { text: url, width: 260, height: 260, colorDark: "#0F172A", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); }
    catch (e) { document.getElementById("qr").textContent = url; }
  })();
</script>
</body>
</html>
