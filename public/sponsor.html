<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sponsor-Panel · My Kiez Berlin</title>
<link rel="icon" type="image/png" href="assets/images/mykiez_logo.png">
<style>
:root{--red:#E30613;--yellow:#F2B705;--ink:#0F172A;--muted:#475569;--bg:#F6F7F9;--card:#fff;--line:#E2E8F0;--blue:#1A73E8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top img{height:34px}.top b{font-size:16px}.top .sp{flex:1}
.langs button,.btn2{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;color:inherit}
.langs button[aria-pressed=true]{background:var(--ink);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 4px}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:inherit}
textarea{min-height:140px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--red);color:#fff;text-decoration:none}
.btn.blue{background:var(--blue)}.btn:disabled{opacity:.5;cursor:default}
.msg{margin-top:10px;font-weight:700;font-size:14px}.ok{color:#15803D}.err{color:#B91C1C}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:140px;background:var(--bg);border-radius:12px;padding:12px}.stat b{display:block;font-size:26px}
.plan{display:inline-block;background:var(--yellow);color:#000;border-radius:8px;padding:2px 10px;font-weight:800;font-size:13px}
.period{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.period label{display:flex;align-items:center;gap:8px;margin:0;padding:10px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600}
.period input:checked+span{font-weight:800}.period label:has(input:checked){border-color:var(--red)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.media figure{margin:0;background:var(--bg);border-radius:12px;overflow:hidden;position:relative}
.media img,.media video{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#000}
.media figcaption{font-size:12px;padding:6px 8px;color:var(--muted)}.media .x{position:absolute;top:6px;right:6px;border:0;border-radius:50%;width:30px;height:30px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.media .mv{display:flex;gap:4px;padding:0 8px 8px}.media .mv button{flex:1;border:1px solid var(--line,#30363d);background:transparent;color:inherit;border-radius:8px;padding:4px 0;cursor:pointer;font-size:13px}
.media .hid{position:absolute;left:6px;top:6px;background:#B91C1C;color:#fff;font-size:11px;border-radius:6px;padding:1px 6px}
.map iframe{width:100%;height:220px;border:0;border-radius:12px;margin-top:10px;background:#e5e3df}
.hidden{display:none!important}
progress{width:100%;margin-top:8px}
/* 2026-11-24 (owner): big blue "choose pictures/videos" button (the small grey file box was not seen), several files at once */
.mpick-in{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.mpick{display:flex;width:100%;margin:8px 0 4px;padding:16px 18px;font-size:17px;background:var(--blue);color:#fff;border-radius:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(26,115,232,.35);text-align:center}
label.mpick:hover{filter:brightness(1.08)}.mpick-in:focus-visible+label.mpick{outline:3px solid #93C5FD;outline-offset:2px}
.mpick-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.mpick-list div{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:#000}
.mpick-list img,.mpick-list video{width:100%;height:100%;object-fit:cover;display:block}.mpick-list span{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;border-radius:5px;padding:0 4px}
.mpick-list div.done{outline:3px solid #15803D}.mpick-list div.fail{outline:3px solid #B91C1C}
#mpick-n{font-weight:800;margin-top:6px}
/* 2026-11-25 (owner): main pictures (cover + logo) + days per package */
.mainpics{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media(max-width:560px){.mainpics{grid-template-columns:1fr}}
.mainpic{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.mainpic b{font-size:14px}.mainpic .ph{position:relative;border-radius:10px;overflow:hidden;background:#e5e7eb;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center}
.mainpic.logo .ph{aspect-ratio:1;background:#fff}.mainpic img{width:100%;height:100%;object-fit:cover;display:block}.mainpic.logo img{object-fit:contain}
.mainpic .lock{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:1px 6px}
.mainpic .row{display:flex;gap:6px;flex-wrap:wrap}.mainpic .row button{flex:1;min-width:110px;border:0;border-radius:10px;padding:10px;font-weight:800;cursor:pointer;color:#fff;background:var(--blue)}
.mainpic .row button.del{background:#fff;color:#B91C1C;border:2px solid #FCA5A5}
input.mdays-n{width:90px!important;padding:6px 8px!important}
</style>
</head>
<body>
<header><div class="top"><img src="assets/images/mykiez_logo.png" alt=""><b>Sponsor-Panel</b><span class="sp"></span>
<span class="langs"><button data-l="de">DE</button> <button data-l="tr">TR</button></span>
<button id="logout" class="btn2 hidden" type="button"></button></div></header>
<main>
  <!-- Login -->
  <section id="login" class="card hidden">
    <h1 data-i="login_h"></h1>
    <p class="muted" data-i="login_txt"></p>
    <label for="lmail" data-i="email"></label><input id="lmail" type="email" autocomplete="email">
    <p><button id="lbtn" class="btn" type="button" data-i="login_btn"></button></p>
    <p id="lmsg" class="msg"></p>
    <p class="muted"><span data-i="no_mail"></span> <a href="mailto:info@mykiezberlin.com">info@mykiezberlin.com</a></p>
  </section>

  <!-- Panel -->
  <section id="panel" class="hidden">
    <div class="card">
      <h1 id="pname"></h1>
      <p><span class="plan" id="pplan"></span> <span class="muted" id="pend"></span></p>
      <div class="stats">
        <div class="stat"><b id="sviews">0</b><span class="muted" data-i="views"></span></div>
        <div class="stat"><b id="sclicks">0</b><span class="muted" data-i="clicks"></span></div>
      </div>
    </div>

    <!-- 2026-11-25 (owner): the sponsor sees his fixed main pictures (cover + logo) and can change them himself -->
    <!-- 2026-11-25 (owner): short guide videos -->
    <p style="text-align:center;margin:0 0 14px"><a href="/anleitung/" target="_blank" rel="noopener" style="display:inline-block;background:#111827;color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;text-decoration:none">🎬 Video-Anleitung · Video kılavuz (45 sn.)</a></p>
    <div class="card" id="maincard">
      <h2>🖼️ <span id="main-h">Hauptbilder · Ana tanıtım resimleri</span></h2>
      <p class="muted" id="main-t"></p>
      <div class="mainpics">
        <div class="mainpic" data-which="image"><b id="main-cover-l"></b><div class="ph"><span class="lock">🔒</span><img alt=""></div>
          <div class="row"><button type="button" class="chg"></button><button type="button" class="del"></button></div></div>
        <div class="mainpic logo" data-which="logo"><b id="main-logo-l"></b><div class="ph"><span class="lock">🔒</span><img alt=""></div>
          <div class="row"><button type="button" class="chg"></button><button type="button" class="del"></button></div></div>
      </div>
      <input type="file" id="mainfile" class="mpick-in" accept="image/jpeg,image/png,image/webp">
      <p id="mainmsg" class="msg"></p>
    </div>

    <div class="card">
      <h2>📸 <span data-i="media_h"></span></h2>
      <p class="muted" data-i="period_txt"></p>
      <div class="period">
        <label><input type="radio" name="period" value="day"><span data-i="daily"></span></label>
        <label><input type="radio" name="period" value="week"><span data-i="weekly"></span></label>
      </div>
      <p class="muted" id="quota"></p>
      <label for="mfile" data-i="file"></label><input id="mfile" class="mpick-in" type="file" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/webm">
      <label for="mfile" class="mpick" id="mpick">📁 Bilder / Videos auswählen · Resim / video seç</label>
      <!-- 2026-11-25 (owner): a whole folder at once (all pictures/videos in it) -->
      <input id="mfolder" class="mpick-in" type="file" multiple webkitdirectory directory>
      <label for="mfolder" class="mpick" id="mfolder-l" style="background:#0F766E;box-shadow:0 4px 14px rgba(15,118,110,.3)">📂 Ganzen Ordner wählen · Tüm klasörü seç</label>
      <div id="mpick-n" class="muted"></div><div id="mpick-list" class="mpick-list"></div>
      <label for="mcap" data-i="caption"></label><input id="mcap" type="text" maxlength="300">
      <!-- 2026-11-23 (owner "UYGULA 11"): how long the upload stays in the sponsor story on the page -->
      <label for="mdays" id="mdays-l">Wie lange sichtbar? · Ne kadar görünsün?</label>
      <select id="mdays"><option value="1">1 Tag · 1 gün</option><option value="2">2 Tage · 2 gün</option><option value="3">3 Tage · 3 gün</option><option value="7">7 Tage · 7 gün</option></select>
      <p><button id="mbtn" class="btn" type="button" data-i="upload"></button></p>
      <progress id="mprog" class="hidden" max="100" value="0"></progress>
      <p id="mmsg" class="msg"></p>
      <!-- 2026-11-23 (owner "UYGULA 12"): send own pictures/videos to customers (WhatsApp, Instagram …) -->
      <p id="mshare-bar" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button id="mshare" class="btn" type="button">📤 Teilen · Paylaş</button><small class="muted" id="mshare-t">Bilder antippen = auswählen (☑). Ohne Auswahl werden alle sichtbaren geteilt. · Seçmek için ☑ işaretle; seçim yoksa hepsi paylaşılır.</small></p>
      <div id="mlist" class="media"></div>
    </div>

    <div class="card">
      <h2>✏️ <span data-i="data_h"></span></h2>
      <div class="grid2">
        <div><label for="f_headline_de" data-i="hl_de"></label><input id="f_headline_de" type="text" maxlength="200"></div>
        <div><label for="f_headline_tr" data-i="hl_tr"></label><input id="f_headline_tr" type="text" maxlength="200"></div>
      </div>
      <label for="f_headline_en" data-i="hl_en"></label><input id="f_headline_en" type="text" maxlength="200">
      <label for="f_description" data-i="desc"></label><textarea id="f_description" maxlength="5000"></textarea>
      <div class="grid2">
        <div><label for="f_address" data-i="address"></label><input id="f_address" type="text" maxlength="120"></div>
        <div><label for="f_hours" data-i="hours"></label><input id="f_hours" type="text" maxlength="80"></div>
        <div><label for="f_link_tel" data-i="tel"></label><input id="f_link_tel" type="tel" maxlength="40"></div>
        <div><label for="f_link_wa" data-i="wa"></label><input id="f_link_wa" type="tel" maxlength="40"></div>
        <div><label for="f_link_web" data-i="web"></label><input id="f_link_web" type="url" maxlength="300"></div>
        <div><label for="f_link_ig" data-i="ig"></label><input id="f_link_ig" type="url" maxlength="300"></div>
        <div><label for="f_email" data-i="pmail"></label><input id="f_email" type="email" maxlength="120"></div>
      </div>
      <div class="map" id="map"></div>
      <p><button id="sbtn" class="btn" type="button" data-i="save"></button> <a id="route" class="btn blue hidden" target="_blank" rel="noopener">🗺️ <span data-i="route"></span></a></p>
      <p id="smsg" class="msg"></p>
    </div>
    <p class="muted" data-i="rules"></p>
  </section>
</main>
<script src="big-upload.js?v=1"></script>
<script src="image-shrink.js?v=2"></script>
<script src="video-check.js?v=2"></script>
<script src="sponsor-share-media.js?v=1"></script>

ail ungültig.", unauthorized: "Link abgelaufen – bitte neu anmelden.", too_many_attempts: "Zu viele Versuche – bitte 1 Stunde warten.", missing_file: "Bitte eine Datei wählen.", offline: "Keine Verbindung." } },

mpts: "Çok fazla deneme – lütfen 1 saat bekle.", missing_file: "Lütfen bir dosya seç.", offline: "Bağlantı yok." } },

  function errText(j) { return (T[lang].errors[j && j.error] || "Fehler · Hata (" + ((j && (j.error || j.status)) || "?") + ")"); }

    state.media.forEach(function (m) {
      var fig = document.createElement("figure");
      var src = m.media_key.charAt(0) === "/" || m.media_key.indexOf("https://") === 0 ? m.media_key : "/media/" + m.media_key; // 2026-11-13: seeded pictures live in /assets
      fig.innerHTML = (m.media_type === "instagram" ? '<a href="' + src + '" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;aspect-ratio:1;background:linear-gradient(135deg,#feda75,#d62976,#4f5bd5);color:#fff;font-weight:800;text-decoration:none">📷 Instagram</a>' : m.media_type === "video" ? '<video src="' + src + '" controls preload="metadata"></video>' : '<img src="' + src + '" alt="" loading="lazy">') +
        (m.status === "hidden" ? '<span class="hid"></span>' : "") + '<button class="x" type="button" aria-label="Delete">✕</button><figcaption></figcaption>';
      fig.querySelector("figcaption").textContent = m.caption || new Date(m.created_at).toLocaleString(lang);
      if (m.status === "hidden") fig.querySelector(".hid").textContent = t("hidden");
      fig.querySelector(".x").onclick = function () { if (!confirm(t("del_q"))) return; api("deleteMedia", { id: m.id }).then(load); };
      // 2026-11-17 (owner): change the order – first, one forward, one back, last (same order in web and app)
      var mv = document.createElement("div");
      mv.className = "mv";
      mv.innerHTML = [["first", "⏮"], ["up", "◀"], ["down", "▶"], ["last", "⏭"]].map(function (b) { return '<button type="button" data-to="' + b[0] + '" title="' + t("mv_" + b[0]) + '">' + b[1] + "</button>"; }).join("");
      mv.querySelectorAll("button").forEach(function (b) { b.onclick = function () { b.disabled = true; api("moveMedia", { id: m.id, to: b.getAttribute("data-to") }).then(load); }; });
      fig.appendChild(mv);
      // 2026-11-23 (owner "UYGULA 11-12"): visible days (change any time) + choose for sharing + share one
      if (m.media_type === "image" || m.media_type === "video") {
        var tr = lang === "tr";
        var days = Number(m.days) || 1;
        var left = m.created_at + days * 86400000 - Date.now();
        var ex = document.createElement("div");
        ex.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 8px 8px;font-size:12px";
        ex.innerHTML = '<label style="display:flex;gap:4px;align-items:center;margin:0"><input type="checkbox" class="msel" style="width:auto"> ☑</label>' +
          daysField(days, "mdays") +
          '<span class="muted">' + (left > 0 ? (tr ? "kalan " : "noch ") + (left > 86400000 ? Math.ceil(left / 86400000) + (tr ? " gün" : " T.") : Math.max(1, Math.round(left / 3600000)) + " h") : (tr ? "süresi doldu" : "abgelaufen")) + "</span>" +
          '<button type="button" class="m1share" style="border:0;border-radius:8px;padding:4px 8px;background:#1f6feb;color:#fff;cursor:pointer">📤</button>';
        ex.querySelector(".msel").checked = !!selected[m.id];
        ex.querySelector(".msel").onchange = function () { if (this.checked) selected[m.id] = 1; else delete selected[m.id]; };
        ex.querySelector(".mdays").onchange = function () { var sel = this; var v = cleanDays(sel.value); if (!v) { sel.value = days; return; } sel.disabled = true; api("setDays", { id: m.id, days: v }).then(load); };
        ex.querySelector(".m1share").onclick = function () { shareItems([m]); };
        fig.appendChild(ex);
      }
      list.appendChild(fig);
    });
  }
  // 2026-11-25 (owner): days in the sponsor story per package – Basic 1/2/3/7 (list), Plus 1–14 (type it), Premium any number
  function daysMax() { return state && state.ad && state.ad.days_max != null ? Number(state.ad.days_max) : 7; }
  function cleanDays(v) {
    var n = Math.floor(Number(v)), max = daysMax();
    if (!(n >= 1)) return 0;
    if (max === 7) return [1, 2, 3, 7].indexOf(n) >= 0 ? n : 0;
    return max ? Math.min(n, max) : n;
  }
  function daysField(cur, cls, id) {
    var tr = lang === "tr", max = daysMax();
    if (max === 7) return '<select class="' + cls + '"' + (id ? ' id="' + id + '"' : "") + ' style="width:auto;padding:3px 6px;font-size:12px">' + [1, 2, 3, 7].map(function (d) { return '<option value="' + d + '"' + (d === cur ? " selected" : "") + ">" + d + (tr ? " gün" : d === 1 ? " Tag" : " Tage") + "</option>"; }).join("") + "</select>";
    return '<input type="number" inputmode="numeric" min="1"' + (max ? ' max="' + max + '"' : "") + ' step="1" class="' + cls + ' mdays-n"' + (id ? ' id="' + id + '"' : "") + ' value="' + cur + '" title="' + (max ? (tr ? "1–" + max + " gün" : "1–" + max + " Tage") : (tr ? "istediğin kadar gün" : "beliebig viele Tage")) + '"> ' + (tr ? "gün" : "Tage");
  }
  // the upload form: list (Basic) or a number field (Plus up to 14, Premium free)
  function uploadDays() {
    var old = $("mdays"), max = daysMax(), tr = lang === "tr";
    if (!old || old.dataset.max === String(max)) return;
    var wrap = document.createElement("span");
    wrap.innerHTML = daysField(Number(old.value) || 1, "", "mdays");
    var neu = wrap.querySelector("#mdays");
    neu.dataset.max = String(max);
    old.replaceWith(neu);
    if (neu.tagName === "INPUT") {
      neu.style.cssText = "width:140px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit";
      neu.insertAdjacentHTML("afterend", ' <span class="muted" id="mdays-hint">' + (max ? (tr ? "gün (en fazla " + max + ")" : "Tage (höchstens " + max + ")") : (tr ? "gün – istediğin kadar" : "Tage – so viele du willst")) + "</span>");
      neu.addEventListener("change", function () { var v = cleanDays(neu.value); neu.value = v || 1; });
    }
  }
  function mainPics() {
    var ad = state.ad, tr = lang === "tr";
    $("main-t").textContent = tr ? "Kartında herkesin gördüğü kapak resmi ve logo. 🔒 Korumalı: sadece sen (bu giriş linkiyle) değiştirebilirsin; eski resim yedekte kalır. Değişiklik hemen sitede görünür."
      : "Titelbild und Logo, die alle auf deiner Karte sehen. 🔒 Geschützt: nur du (mit diesem Login-Link) kannst sie ändern, das alte Bild bleibt als Sicherung. Die Änderung ist sofort auf der Seite.";
    $("main-cover-l").textContent = tr ? "Kapak / tanıtım resmi" : "Titelbild / Werbebild";
    $("main-logo-l").textContent = "Logo";
    document.querySelectorAll(".mainpic").forEach(function (box) {
      var w = box.getAttribute("data-which"), url = w === "logo" ? ad.logo : ad.image;
      var img = box.querySelector("img");
      if (url) { img.src = url; img.style.display = ""; } else { img.removeAttribute("src"); img.style.display = "none"; }
      box.querySelector(".chg").textContent = tr ? "🔄 Değiştir" : "🔄 Ändern";
      box.querySelector(".del").textContent = tr ? "🗑️ Sil + yenisini yükle" : "🗑️ Löschen + neues hochladen";
    });
  }
  var mainWhich = "";
  function mainPick(which, del) {
    var tr = lang === "tr";
    if (del && !confirm(tr ? "Bu resim silinsin mi? Kartın boş kalmaması için hemen yerine yeni bir resim seçmen gerekiyor. (Eski resim yedekte kalır.)"
      : "Dieses Bild löschen? Damit deine Karte nicht leer ist, wählst du gleich ein neues Bild. (Das alte bleibt als Sicherung.)")) return;
    mainWhich = which;
    $("mainfile").value = "";
    $("mainfile").click();
  }
  document.querySelectorAll(".mainpic").forEach(function (box) {
    box.querySelector(".chg").onclick = function () { mainPick(box.getAttribute("data-which"), false); };
    box.querySelector(".del").onclick = function () { mainPick(box.getAttribute("data-which"), true); };
  });
  $("mainfile").addEventListener("change", function () {
    var f = this.files && this.files[0], tr = lang === "tr", which = mainWhich;
    if (!f || !which) return;
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { msg("mainmsg", errText({ error: "unsupported_file" }), false); return; }
    msg("mainmsg", tr ? "⏳ Yükleniyor…" : "⏳ Wird hochgeladen …", true);
    (window.mkShrinkImage ? window.mkShrinkImage(f) : Promise.resolve(f)).catch(function () { return f; }).then(function (small) {
      return new Promise(function (ok) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = function () { ok(""); }; r.readAsDataURL(small); });
    }).then(function (data) {
      return api("setMainImage", { which: which, data: data });
    }).then(function (j) {
      if (j.ok) { msg("mainmsg", tr ? "✓ Değiştirildi – şimdi sitede." : "✓ Geändert – jetzt auf der Seite.", true); state.ad[which === "logo" ? "logo" : "image"] = j.url; mainPics(); }
      else msg("mainmsg", errText(j), false);
    });
  });
  // a whole folder: only pictures/videos from it, then the same preview + upload as "choose"
  $("mfolder").addEventListener("change", function () {
    picked = Array.prototype.slice.call(this.files || []).filter(function (f) { return /^(image\/(jpeg|png|webp)|video\/(mp4|webm))$/.test(f.type); });
    pickInfo();
    if (!picked.length) msg("mmsg", lang === "tr" ? "Bu klasörde resim/video yok." : "In diesem Ordner sind keine Bilder/Videos.", false);
  });

  function fill() { FIELDS.forEach(function (k) { $("f_" + k).value = state.ad[k] || ""; }); maps(state.ad); }

  function load() {
    return api("me").then(function (j) {
      if (j.status === 401 || !j.ad) { showLogin(); if (token) msg("lmsg", errText({ error: "unauthorized" }), false); return; }
      var first = !state; state = j;
      window.mkSponsorVip = !!(j.quota && j.quota.unlimited); // 2026-11-24: trusted sponsor -> big files in parts
      $("login").classList.add("hidden"); $("panel").classList.remove("hidden"); $("logout").classList.remove("hidden");
      if (first) fill();
      render();
    });
  }

  document.querySelectorAll("input[name=period]").forEach(function (r) {
    r.onchange = function () { api("update", { fields: { media_period: r.value } }).then(load); };
  });
  $("sbtn").onclick = function () {
    var fields = {}; FIELDS.forEach(function (k) { fields[k] = $("f_" + k).value; });
    $("sbtn").disabled = true;
    api("update", { fields: fields }).then(function (j) {
      $("sbtn").disabled = false;
      if (j.ok) { msg("smsg", t("saved"), true); state.ad = Object.assign(state.ad, fields); maps(state.ad); } else msg("smsg", errText(j), false);
    });
  };
  // 2026-11-24 (owner): several pictures/videos at once – preview, then all are uploaded one after the other
  var picked = [];
  function pickInfo() {
    var tr = lang === "tr", n = picked.length;
    $("mpick").textContent = n ? (tr ? "📁 Değiştir / başka seç (" + n + " seçili)" : "📁 Ändern / andere wählen (" + n + " gewählt)") : "📁 Bilder / Videos auswählen · Resim / video seç";
    $("mpick-n").textContent = n ? (tr ? n + " dosya seçildi – şimdi \"" + t("upload") + "\" düğmesine bas." : n + " Datei(en) gewählt – jetzt auf \"" + t("upload") + "\" tippen.") : "";
    var box = $("mpick-list");
    box.querySelectorAll("img,video").forEach(function (m) { if (m.src.indexOf("blob:") === 0) URL.revokeObjectURL(m.src); });
    box.innerHTML = "";
    picked.forEach(function (f, i) {
      var d = document.createElement("div"); d.dataset.i = i;
      var u = URL.createObjectURL(f);
      d.innerHTML = (f.type.indexOf("video") === 0 ? '<video src="' + u + '#t=0.5" muted playsinline preload="metadata"></video><span>▶ ' : '<img src="' + u + '" alt=""><span>') + (f.size > 1048576 ? Math.round(f.size / 1048576) + " MB" : Math.max(1, Math.round(f.size / 1024)) + " KB") + "</span>";
      box.appendChild(d);
    });
  }
  $("mfile").addEventListener("change", function () { picked = Array.prototype.slice.call(this.files || []); pickInfo(); });
  function sendOne(file) {
    return new Promise(function (done) {
      function post(ref) {
        var fd = new FormData(); fd.append("file", ref || file); fd.append("caption", $("mcap").value); fd.append("days", $("mdays").value);
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/sponsor-media"); xhr.setRequestHeader("x-sponsor-token", token);
        xhr.upload.onprogress = function (ev) { if (ev.lengthComputable) $("mprog").value = Math.round(ev.loaded / ev.total * 100); };
        xhr.onloadend = function () { var j = {}; try { j = JSON.parse(xhr.responseText); } catch (e) {} j.status = xhr.status; done(xhr.status === 201 ? { ok: true } : { ok: false, j: xhr.status === 0 ? { error: "offline" } : j }); };
        xhr.send(fd);
      }
      if (window.mkSponsorVip && window.mkBigUpload && file.size > 20 * 1024 * 1024) {
        window.mkBigUpload(file, { "x-sponsor-token": token }, { target: "sponsor", onProgress: function (p) { $("mprog").value = Math.round(p * 100); } })
          .then(function (r) { post(r || null); }).catch(function () { done({ ok: false, j: { error: "offline" } }); });
      } else post(null);
    });
  }
  $("mbtn").addEventListener("click", function (ev) {
    if (!picked.length) return; // nothing chosen: the old way below shows "please choose a file"
    ev.stopImmediatePropagation();
    var tr = lang === "tr", list = picked.slice(), okN = 0, i = 0;
    $("mbtn").disabled = true; $("mpick").style.pointerEvents = "none"; $("mprog").classList.remove("hidden");
    (function next() {
      if (i >= list.length) {
        $("mprog").classList.add("hidden"); $("mbtn").disabled = false; $("mpick").style.pointerEvents = "";
        if (okN === list.length) { msg("mmsg", okN === 1 ? t("uploaded") : (tr ? okN + " dosya yüklendi ✓ – şimdi yayında." : okN + " Dateien hochgeladen ✓ – jetzt online."), true); $("mfile").value = ""; $("mcap").value = ""; picked = []; pickInfo(); }
        load();
        return;
      }
      var cell = $("mpick-list").querySelector('[data-i="' + i + '"]');
      msg("mmsg", (tr ? "⏳ " + (i + 1) + " / " + list.length + " yükleniyor…" : "⏳ " + (i + 1) + " / " + list.length + " wird hochgeladen …"), true);
      $("mprog").value = 0;
      (window.mkShrinkImage ? window.mkShrinkImage(list[i]) : Promise.resolve(list[i])).catch(function () { return list[i]; }).then(sendOne).then(function (r) {
        if (cell) cell.className = r.ok ? "done" : "fail";
        if (r.ok) { okN++; i++; next(); return; }
        // stop at the first error (e.g. daily/weekly quota full) and say how many are online
        $("mprog").classList.add("hidden"); $("mbtn").disabled = false; $("mpick").style.pointerEvents = "";
        msg("mmsg", (tr ? okN + " / " + list.length + " yüklendi. Durdu: " : okN + " / " + list.length + " hochgeladen. Gestoppt: ") + errText(r.j), false);
        picked = list.slice(i); pickInfo(); if (okN) load(); // the ones not online yet stay chosen
      });
    })();
  }, true);
  $("mbtn").onclick = function () {
    var file = $("mfile").files[0];
    if (!file) { msg("mmsg", errText({ error: "missing_file" }), false); return; }
    // 2026-11-17 (owner): pictures are made smaller before upload (max. 1600 px, WebP) – faster web and app
    $("mbtn").disabled = true;
    (window.mkShrinkImage ? window.mkShrinkImage(file) : Promise.resolve(file)).then(function (small) { send(small); });
  };
  function send(file, ref) {
    // 2026-11-24 (owner): trusted sponsor – a file over 20 MB goes in parts first (no size limit)
    if (!ref && window.mkSponsorVip && window.mkBigUpload && file.size > 20 * 1024 * 1024) {
      $("mbtn").disabled = true; $("mprog").classList.remove("hidden");
      window.mkBigUpload(file, { "x-sponsor-token": token }, { target: "sponsor", onProgress: function (p) { $("mprog").value = Math.round(p * 100); } })
        .then(function (r) { send(file, r || "none"); })
        .catch(function () { $("mprog").classList.add("hidden"); $("mbtn").disabled = false; msg("mmsg", errText({ error: "offline" }), false); });
      return;
    }
    var fd = new FormData(); fd.append("file", ref && ref !== "none" ? ref : file); fd.append("caption", $("mcap").value);
    fd.append("days", $("mdays").value); // 2026-11-23 (owner "UYGULA 11")
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/sponsor-media"); xhr.setRequestHeader("x-sponsor-token", token);
    $("mprog").classList.remove("hidden"); $("mbtn").disabled = true;
    xhr.upload.onprogress = function (ev) { if (ev.lengthComputable) $("mprog").value = Math.round(ev.loaded / ev.total * 100); };
    xhr.onloadend = function () {
      $("mprog").classList.add("hidden"); $("mbtn").disabled = false;
      var j = {}; try { j = JSON.parse(xhr.responseText); } catch (e) {} j.status = xhr.status;
      if (xhr.status === 201) { msg("mmsg", t("uploaded"), true); $("mfile").value = ""; $("mcap").value = ""; picked = []; pickInfo(); load(); }
      else msg("mmsg", errText(xhr.status === 0 ? { error: "offline" } : j), false);
    };
    xhr.send(fd);
  }

  // 2026-11-23 (owner "UYGULA 12"): share own pictures/videos with customers (text ends with My Kiez Berlin + app + /s/<id>)
  var selected = {};
  function mediaSrc(m) { return m.media_key.charAt(0) === "/" || m.media_key.indexOf("https://") === 0 ? m.media_key : "/media/" + m.media_key; }
  function shareItems(list) {
    if (!window.mkSponsorShare || !state) return;
    var tr = lang === "tr";
    msg("mmsg", tr ? "⏳ Hazırlanıyor…" : "⏳ Wird vorbereitet …", true);
    window.mkSponsorShare(state.ad.name, state.ad.id, list.map(function (m) { return { url: mediaSrc(m), caption: m.caption || "" }; }), lang).then(function (r) {
      msg("mmsg", r === "ok" ? (tr ? "✓ Paylaşıldı" : "✓ Geteilt") : r === "again" ? (tr ? "Dosyalar hazır – 📤 düğmesine bir kez daha bas." : "Dateien bereit – bitte 📤 noch einmal tippen.") : r === "cancel" ? "" : (tr ? "Metin + linkler kopyalandı – resimleri telefondan ekle." : "Text + Links kopiert – Bilder am Handy dazu."), r !== "cancel");
    });
  }
  $("mshare").onclick = function () {
    if (!state) return;
    var live = state.media.filter(function (m) { return m.status === "live" && (m.media_type === "image" || m.media_type === "video"); });
    var pick = live.filter(function (m) { return selected[m.id]; });
    shareItems(pick.length ? pick : live.slice(0, 10));
  };

  apply();
  if (token) load(); else showLogin();
})();
</script>
<script src="/kiez-word.js?v=2"></script>
