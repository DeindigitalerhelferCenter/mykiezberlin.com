var lang = (function () { var l = new URLSearchParams(location.search).get('lang'); try { l = l || localStorage.getItem('mkb_lang'); } catch (e) { } l = l || (navigator.language || 'de').slice(0, 2); return T[l] ? l : 'de'; })();
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function apply() {
  var d = T[lang]; document.documentElement.lang = lang;
  try { localStorage.setItem('mkb_lang', lang); } catch (e) { }
  document.querySelectorAll('[data-i]').forEach(function (el) { el.textContent = d[el.getAttribute('data-i')]; });
  document.querySelectorAll('.langs button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.l === lang); });
  document.getElementById('howtxt').textContent = d.self.replace(/^[^:]{1,20}:\s*/, ''); /* heading already says "So geht's" */
  document.getElementById('consent').innerHTML = esc(d.consent).replace('{ds}', '<a href="' + document.getElementById('ds').href + '" target="_blank" rel="noopener">' + esc(d.ds_word) + '</a>');
}
document.querySelectorAll('.langs button').forEach(function (b) { b.onclick = function () { lang = b.dataset.l; apply(); }; });
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target, g = function (k) { return f.elements[k].value.trim(); };
  if (!f.elements.consent.checked || !f.reportValidity()) return;
  var btn = f.querySelector('button'); btn.disabled = true;
  fetch('/api/werben', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ company: g('company'), person: g('person'), email: g('email'), phone: g('phone'), address: g('address'), size: g('size'), message: g('message'), hp: g('hp'), lang: lang }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.ok && j.checkoutUrl) document.getElementById('formBox').innerHTML = '<div class="ok paybox"><span>' + esc(T[lang].pay_txt) + '</span><a class="btn pay" href="' + esc(j.checkoutUrl) + '" rel="noopener">' + esc(T[lang].pay_btn) + '</a></div>';
      else if (j.ok) document.getElementById('formBox').innerHTML = '<p class="ok">' + esc(T[lang].ok) + (['s', 'm', 'l'].indexOf(g('size')) >= 0 ? ' ' + esc(T[lang].pay_later) : '') + '</p>';
      else { alert(j.error === 'rate' ? T[lang].err_rate : T[lang].err); btn.disabled = false; }
    }).catch(function () { alert(T[lang].err_net); btn.disabled = false; });
});
var pre = new URLSearchParams(location.search).get('size'); if (pre) document.querySelector('select[name=size]').value = pre;
/* "Eintrag übernehmen": a business from the app/web list claims its listing */
var claim = new URLSearchParams(location.search).get('claim');
if (claim) {
  var form = document.getElementById('f');
  form.elements.company.value = claim.slice(0, 120);
  form.elements.message.value = ({ de: 'Ich möchte den Eintrag „' + claim + '“ übernehmen und meine Angaben bestätigen.', tr: '„' + claim + '“ kaydını sahiplenmek ve bilgilerimi doğrulamak istiyorum.', en: 'I would like to claim the listing “' + claim + '” and confirm my details.' })[lang];
  setTimeout(function () { form.scrollIntoView({ behavior: 'smooth' }); }, 300);
}
apply();
(function () {
  var q = new URLSearchParams(location.search), box = document.getElementById('payNotice');
  if (q.get('paid')) box.innerHTML = '<p class="ok paid">' + esc(T[lang].paid_ok) + '</p>';
  else if (q.get('canceled')) box.innerHTML = '<p class="note">' + esc(T[lang].canceled) + '</p>';
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(function () { });
</script>
<script>
/* ===== Design: Hell/Dunkel-Schalter (nur Darstellung) ===== */
(function () {
  var btn = document.getElementById('themeBtn'), root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() { var a = root.getAttribute('data-theme'); return a ? a === 'dark' : !!(mq && mq.matches); }
  function paint() { btn.textContent = isDark() ? '☀️' : '🌙'; }
  btn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('mkb_theme', next); } catch (e) { }
    paint();
  });
  if (mq && mq.addEventListener) mq.addEventListener('change', paint);
  paint();
})();
/* Gründungspartner-Button: Formular mit passender Auswahl öffnen */
document.querySelectorAll('.gpbtn').forEach(function (b) { b.addEventListener('click', function () { var f = document.getElementById('f'); if (f && f.elements.size) f.elements.size.value = 'gp'; }); });
/* 2026-11-11: coming from the B2B screen (?size=s|m|l) the package is already chosen –
   show it above the form and jump straight to the form, so the packages are not shown twice. */
(function () {
  var q = new URLSearchParams(location.search), size = q.get('size'), f = document.getElementById('f');
  var P = { s: ['Kiez Basic', 29], m: ['Kiez Plus', 49], l: ['Kiez Premium', 89] };
  if (!f || !P[size] || q.get('claim') || q.get('paid') || q.get('canceled')) return;
  var L = { de: ['Gewähltes Paket', '/Monat · die ersten 3 Monate 19 €/Monat', 'Paket ändern'],
            tr: ['Seçilen paket', '/ay · ilk 3 ay 19 €/ay', 'Paketi değiştir'],
            en: ['Chosen package', '/month · first 3 months €19/month', 'Change package'] }[lang] || [];
  var box = document.createElement('div');
  box.className = 'chosenpk';
  box.style.cssText = 'border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px;background:var(--sv);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center';
  box.innerHTML = '<span style="font-size:13px;color:var(--muted)">' + esc(L[0]) + '</span><b style="font-size:18px">' + esc(P[size][0]) + '</b>' +
    '<span style="font-weight:700">' + P[size][1] + ' €' + esc(L[1]) + '</span>' +
    '<a href="#pakete" id="changePk" style="margin-left:auto;font-weight:700">' + esc(L[2]) + '</a>';
  f.parentNode.insertBefore(box, f);
  var grid = document.querySelector('.grid');
  if (grid && !grid.id) grid.id = 'pakete';
  document.getElementById('changePk').addEventListener('click', function (e) {
    e.preventDefault();
    if (grid) grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  function sync(v) {
    if (!P[v]) { box.style.display = 'none'; return; }
    box.style.display = 'flex';
    box.querySelector('b').textContent = P[v][0];
    box.querySelector('span:nth-of-type(2)').textContent = P[v][1] + ' €' + L[1];
  }
  f.elements.size.addEventListener('change', function () { sync(f.elements.size.value); });
  document.querySelectorAll('a[href="#f"]').forEach(function (b) { b.addEventListener('click', function () { setTimeout(function () { sync(f.elements.size.value); }, 0); }); });
  // keep the box below the sticky header
  setTimeout(function () {
    var head = document.querySelector('header, .top');
    var off = head ? head.getBoundingClientRect().height : 0;
    window.scrollTo({ top: box.getBoundingClientRect().top + window.pageYOffset - off - 16, behavior: 'auto' });
  }, 150);
})();
/* #1 / #2: every "choose" button preselects its package, scrolls to the form and focuses the first field */
document.querySelectorAll('a[href="#f"]').forEach(function (b) {
  b.addEventListener('click', function (e) {
    var f = document.getElementById('f'); if (!f) return;
    e.preventDefault();
    if (b.dataset.size && f.elements.size) f.elements.size.value = b.dataset.size;
    f.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(function () { try { f.elements.company.focus({ preventScroll: true }); } catch (x) { } }, 450);
  });
});
</script>
