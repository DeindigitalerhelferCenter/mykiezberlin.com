<!doctype html>
<!-- 2026-11-27 (owner): 9:16 cards a sponsor posts in his own story / status – shows the sponsor AND My Kiez Berlin.
     #d=<json>: { type: "partner" | "follow", name, sub, kiez, addr, img, logo, mk, qr, qrLabel, accent, bg } -->
<html lang="de"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#fff}
  .card{position:relative;width:1080px;height:1920px;background:var(--bg,#14100c);overflow:hidden}
  .photo{position:absolute;inset:0 0 auto 0;height:1150px;background-size:cover;background-position:center}
  .photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 35%,var(--bg,#14100c) 100%)}
  .top{position:absolute;top:70px;left:70px;right:70px;display:flex;justify-content:space-between;align-items:center}
  .badge{display:inline-flex;align-items:center;gap:14px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:2px solid var(--accent,#d4a24c);border-radius:999px;padding:14px 26px 14px 14px;font-weight:800;font-size:28px;letter-spacing:.5px}
  .badge img{width:62px;height:62px;border-radius:14px;background:#fff;padding:4px}
  .slogo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid var(--accent,#d4a24c);background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .body{position:absolute;left:70px;right:70px;top:870px}
  .kicker{color:var(--accent,#d4a24c);font-weight:900;font-size:34px;letter-spacing:4px;text-transform:uppercase}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:900;font-size:104px;line-height:1.02;margin:14px 0 18px}
  .sub{font-size:38px;line-height:1.35;color:#eee;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .tr{font-size:32px;line-height:1.35;color:#c9c1b6;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .addr{margin-top:26px;font-size:30px;color:#fff;font-weight:600}
  .foot{position:absolute;left:50px;right:50px;bottom:60px;background:#fff;color:#111;border-radius:36px;padding:30px 34px;display:flex;gap:30px;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .foot .t{flex:1}
  .foot .t b{display:block;font-size:40px;font-weight:900;line-height:1.1}
  .foot .t span{display:block;font-size:27px;color:#444;margin-top:8px;line-height:1.3}
  .foot .t i{display:inline-block;margin-top:14px;font-style:normal;font-weight:900;font-size:30px;color:#fff;background:#E30613;border-radius:14px;padding:10px 18px}
  .qr{width:220px;height:220px;padding:10px;background:#fff;border-radius:16px;border:3px solid #111;flex:0 0 auto}
  .qr img,.qr canvas{width:196px!important;height:196px!important}
  /* follow card */
  .split{position:absolute;inset:0}
  .split .photo{height:820px}
  .fbody{position:absolute;left:70px;right:70px;top:640px}
  .follow{position:absolute;left:50px;right:50px;top:1040px;bottom:60px;background:linear-gradient(160deg,#0d1117,#1b2b22);border:3px solid #25D366;border-radius:40px;padding:44px 46px}
  .follow h2{font-size:58px;font-weight:900;line-height:1.08}
  .follow .tr2{font-size:34px;color:#7ee2a8;font-weight:800;margin-top:8px}
  .rows{margin-top:30px;display:grid;gap:16px;margin-right:290px}
  .row{display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.07);border-radius:22px;padding:18px 22px;font-size:33px;font-weight:700}
  .row .ic{width:66px;height:66px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:38px;flex:0 0 auto}
  .row small{display:block;font-size:25px;color:#b7c2cc;font-weight:600}
  .fq{position:absolute;right:46px;bottom:44px}
  .fq .qr{width:250px;height:250px}.fq .qr img,.fq .qr canvas{width:226px!important;height:226px!important}
  .fq p{text-align:center;font-size:24px;color:#7ee2a8;font-weight:800;margin-top:8px}
</style></head><body><div class="card" id="c"></div>
<script>
  var d = JSON.parse(decodeURIComponent(location.hash.slice(1).replace(/^d=/, "")));
  var c = document.getElementById("c");
  c.style.setProperty("--accent", d.accent || "#d4a24c"); c.style.setProperty("--bg", d.bg || "#14100c");
  function esc(s){return String(s||"").replace(/[&<>"]/g,function(x){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x];});}
  // 2026-11-27 (owner): sponsors without a logo get a round monogram (initials) in their own colour
  function logoHtml() {
    if (d.logo) return '<img class="slogo" src="' + d.logo + '">';
    return '<div class="slogo" style="display:flex;align-items:center;justify-content:center;background:' + (d.accent || "#d4a24c") + ';color:#fff;font-family:Playfair Display,Georgia,serif;font-weight:900;font-size:58px">' + esc(d.mono || "MK") + "</div>";
  }
  var H1 = d.h1 || 104;
  var badge = '<div class="badge"><img src="' + d.mk + '">My Kiez Berlin · Kiez-Partner</div>';
  // no gallery photo -> colour background with the big logo (covers are text banners and look cut in 9:16)
  function photoHtml(h) {
    if (d.img) return '<div class="photo" style="background-image:url(\'' + d.img + '\')' + (h ? ";height:" + h + "px" : "") + '"></div>';
    var big = d.logo ? '<img src="' + d.logo + '" style="width:440px;height:440px;border-radius:50%;object-fit:cover;border:8px solid ' + (d.accent || "#d4a24c") + ';box-shadow:0 30px 80px rgba(0,0,0,.55);background:#fff">'
      : '<div style="width:440px;height:440px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:' + (d.accent || "#d4a24c") + ';font-family:Playfair Display,Georgia,serif;font-weight:900;font-size:170px">' + esc(d.mono || "MK") + "</div>";
    return '<div class="photo" style="' + (h ? "height:" + h + "px;" : "") + 'display:flex;align-items:center;justify-content:center;padding-top:' + (h ? 60 : 120) + 'px;background:radial-gradient(circle at 50% 42%,' + (d.accent || "#d4a24c") + ' 0%,' + (d.bg || "#14100c") + ' 62%)">' + big + "</div>";
  }
  if (d.type === "partner") {
    c.innerHTML = photoHtml(0) +
      '<div class="top">' + badge + logoHtml() + '</div>' +
      '<div class="body"><div class="kicker">' + esc(d.kicker) + '</div><h1 style="font-size:' + H1 + 'px">' + esc(d.name) + '</h1><div class="sub">' + esc(d.sub) + '</div><div class="tr">' + esc(d.subTr) + '</div><div class="addr">📍 ' + esc(d.addr) + '</div></div>' +
      '<div class="foot"><div class="t"><b>' + esc(d.footDe) + '</b><span>' + esc(d.footTr) + '</span><i>' + esc(d.qrLabel) + '</i></div><div class="qr" id="q"></div></div>';
  } else {
    c.innerHTML = '<div class="split">' + photoHtml(820) +
      '<div class="top">' + badge + logoHtml() + '</div>' +
      '<div class="fbody"><h1 style="font-size:' + Math.round(H1 * 0.88) + 'px">' + esc(d.name) + '</h1><div class="sub">' + esc(d.sub) + '</div></div>' +
      '<div class="follow"><h2>' + esc(d.followDe) + '</h2><div class="tr2">' + esc(d.followTr) + '</div><div class="rows">' +
      d.rows.map(function (r) { return '<div class="row"><span class="ic" style="background:' + r.c + '">' + r.i + '</span><div>' + esc(r.t) + '<small>' + esc(r.s) + '</small></div></div>'; }).join("") +
      '</div><div class="fq"><div class="qr" id="q"></div><p>' + esc(d.qrLabel) + '</p></div></div></div>';
  }
  new QRCode(document.getElementById("q"), { text: d.qr, width: 400, height: 400, colorDark: "#111111", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
</script></body></html>
